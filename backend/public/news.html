<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>News | TCR Admin</title>
<link rel="icon" href="/assets/opt/logo.webp">
<link rel="stylesheet" href="/admin.css">
</head>
<body data-page="news">
<main class="page">
  <div class="head">
    <div>
      <p class="eyebrow">Announcements</p>
      <h1>News</h1>
      <p class="sub">Published updates appear on the public home page.</p>
    </div>
  </div>
  <section class="panel">
    <h2>Write an update</h2>
    <form id="newsForm" class="form gap">
      <label class="field">Title<input name="title" required maxlength="160" placeholder="e.g. October Team Tournament Results"></label>
      <div class="form-2">
        <label class="field">Type<select name="type"><option>Announcement</option><option>Tournament</option><option>Results</option><option>New Member</option><option>Achievement</option><option>Upcoming Event</option></select></label>
        <label class="field">Date<input name="date" type="date"></label>
      </div>
      <label class="field">Details<textarea name="body" rows="4" required maxlength="5000" placeholder="Write the update for the website"></textarea></label>
      <label class="check"><input name="published" type="checkbox" checked> Show it on the website now</label>
      <div class="btn-row"><button type="submit" class="btn btn-primary" id="saveNews">Save update</button></div>
    </form>
  </section>
  <section class="panel">
    <h2>Your updates</h2>
    <div id="newsList" class="gap"></div>
  </section>
</main>
<script src="/admin-core.js"></script>
<script src="/news.js"></script>
</body>
</html>
