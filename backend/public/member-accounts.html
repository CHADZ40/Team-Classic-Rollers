<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Member Accounts | TCR Admin</title>
<link rel="icon" href="/assets/opt/logo.webp">
<link rel="stylesheet" href="/admin.css">
</head>
<body data-page="accounts">
<main class="page">
  <div class="head">
    <div>
      <p class="eyebrow">Telegram</p>
      <h1>Member accounts</h1>
      <p class="sub">Link a player's Telegram so they can use the Member Portal. After that, they can sign in themselves by sending /login to the bot.</p>
    </div>
  </div>
  <section class="panel">
    <h2>Create a verification link</h2>
    <p class="dim">Pick the player, then send them the link. It works once and lasts 10 minutes.</p>
    <div class="form gap">
      <label class="field">Player<select id="member"></select></label>
      <div class="btn-row"><button type="button" class="btn btn-primary" id="generate">Create link</button></div>
    </div>
    <div id="result" class="gap" hidden></div>
  </section>
  <section class="panel">
    <h2>Linked accounts</h2>
    <div id="accounts" class="gap"></div>
  </section>
</main>
<script src="/admin-core.js"></script>
<script>
  async function loadAccounts() {
    const data = await api("/api/admin/member-accounts");
    $("#member").innerHTML = data.members.map((m) => `<option value="${esc(m.id)}">${esc(m.name)} · ${esc(m.team)}</option>`).join("");
    $("#accounts").innerHTML = data.accounts.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Player</th><th>Telegram</th><th>Linked on</th><th></th></tr></thead>
      <tbody>${data.accounts.map((a) => `<tr>
        <td>${esc(a.member?.name || "Missing player")}<small>${esc(a.member?.team || "")}</small></td>
        <td>${a.telegramUsername ? `@${esc(a.telegramUsername)}` : esc(a.telegramId)}</td>
        <td>${a.verifiedAt ? esc(new Date(a.verifiedAt).toLocaleDateString()) : "—"}</td>
        <td><button type="button" class="btn btn-danger-quiet" data-unlink="${esc(a.telegramId)}" data-name="${esc(a.member?.name || "this player")}">Unlink</button></td>
      </tr>`).join("")}</tbody></table></div>` : '<p class="empty">No linked accounts yet.</p>';
    $$("[data-unlink]").forEach((button) => button.addEventListener("click", async () => {
      const yes = await confirmAction({ title: `Unlink ${button.dataset.name}?`, body: "They won't be able to sign in until you send them a new link.", confirm: "Unlink account", cancel: "Keep linked", danger: true });
      if (yes && await run(button, () => api(`/api/admin/member-accounts/${encodeURIComponent(button.dataset.unlink)}/unlink`, { method: "POST", body: {} }), "Account unlinked.")) await loadAccounts();
    }));
  }
  $("#generate").addEventListener("click", async (event) => {
    let data = null;
    const ok = await run(event.currentTarget, async () => { data = await api("/api/admin/member-accounts/verification", { method: "POST", body: { memberId: $("#member").value } }); });
    if (!ok) return;
    const box = $("#result");
    box.hidden = false;
    box.innerHTML = `<p>Expires ${esc(new Date(data.expiresAt).toLocaleTimeString())}. Send this to the player, or let them scan the code.</p>
      <div class="btn-row gap"><button type="button" class="btn btn-primary" id="copyLink">Copy link</button><a class="btn btn-secondary" href="${esc(data.link)}" target="_blank" rel="noopener">Open in Telegram</a></div>
      <img class="gap" src="${esc(data.qr)}" alt="Verification QR code" style="width:220px;background:#fff;padding:8px;border-radius:12px">`;
    $("#copyLink").addEventListener("click", () => navigator.clipboard.writeText(data.link).then(() => toast("Link copied."), () => toast("Couldn't copy. Use Open in Telegram.", true)));
  });
  loadAccounts().catch((error) => toast(error.message, true));
</script>
</body>
</html>
