<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCR Member Accounts</title><style>body{font:16px system-ui;margin:0;background:#f4f7fb;color:#17243a}header{background:#071a35;color:white;padding:18px}main{max-width:1000px;margin:20px auto;padding:0 14px}.card{background:white;padding:18px;border:1px solid #dfe6ef;border-radius:14px;margin-bottom:14px}button{padding:10px 13px;background:#123d70;color:white;border:0;border-radius:8px;cursor:pointer}select{padding:10px;max-width:100%;width:100%;margin:8px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5eaf1}#qr{max-width:260px;width:100%}.muted{color:#65758b}@media(max-width:600px){table{font-size:13px}td,th{padding:7px}}</style><link rel="stylesheet" href="/tcr-member-theme.css"></head><body><header><b>Team Classic Rollers · Member Accounts</b><p>Link Telegram accounts to existing roster profiles.</p></header><main><section class="card"><h2>Generate verification link</h2><p class="muted">Select the exact member profile. Link and QR expire after 10 minutes and are single-use.</p><select id="member"></select><button id="generate">Generate link & QR</button><div id="result"></div></section><section class="card"><h2>Linked accounts</h2><button id="refresh">Refresh</button><div id="accounts"></div></section><p><a href="/dashboard.html">Back to dashboard</a></p></main><script>const $=s=>document.querySelector(s);async function req(url,opts={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed. Sign in to the admin dashboard first.');return j}async function load(){const d=await req('/api/admin/member-accounts');$('#member').innerHTML=d.members.map(m=>`<option value="${m.id}">${m.name} · ${m.team}</option>`).join('');$('#accounts').innerHTML=d.accounts.length?'<table><thead><tr><th>Telegram</th><th>Member</th><th>Verified</th><th>Action</th></tr></thead><tbody>'+d.accounts.map(a=>`<tr><td>${a.telegramUsername?'@'+a.telegramUsername:a.telegramId}<br><small>${a.telegramId}</small></td><td>${a.member?.name||'Missing'} · ${a.member?.team||''}</td><td>${a.verifiedAt||'—'}</td><td><button onclick="unlink('${a.telegramId}')">Unlink</button></td></tr>`).join('')+'</tbody></table>':'<p class="muted">No linked accounts yet.</p>'}window.unlink=async id=>{if(!confirm('Unlink this Telegram account?'))return;try{await req('/api/admin/member-accounts/'+encodeURIComponent(id)+'/unlink',{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}};$('#generate').onclick=async()=>{try{const d=await req('/api/admin/member-accounts/verification',{method:'POST',body:JSON.stringify({memberId:$('#member').value})});$('#result').innerHTML=`<p>Expires: ${new Date(d.expiresAt).toLocaleString()}</p><p><a href="${d.link}" target="_blank" rel="noopener">Open Telegram verification</a></p><img id="qr" src="${d.qr}" alt="Verification QR"><p><button id="copy">Copy link</button></p>`;$('#copy').onclick=()=>navigator.clipboard.writeText(d.link)}catch(e){alert(e.message)}};$('#refresh').onclick=()=>load().catch(e=>alert(e.message));load().catch(e=>alert(e.message));</script></body></html>
