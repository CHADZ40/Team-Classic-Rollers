<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login | Team Classic Rollers</title>
  <link rel="icon" href="/assets/tcr-logo.png">
  <link rel="stylesheet" href="/admin.css">
</head>

<body class="login-body">
  <main class="login-card"><img src="/assets/opt/logo.webp" alt="Team Classic Rollers" class="admin-logo">
    <p class="eyebrow">TEAM CLASSIC ROLLERS</p>
    <h1>Admin Login</h1>
    <p class="muted">Sign in to manage members, scores, and website content.</p>
    <form id="loginForm"><label>Username<input name="username" autocomplete="username" required
          value="admin"></label><label>Password<input type="password" name="password" autocomplete="current-password"
          required></label><button class="btn btn-primary" type="submit">Sign In</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>

</html>
