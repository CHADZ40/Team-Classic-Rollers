<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Activity | TCR Admin</title>
<link rel="icon" href="/assets/opt/logo.webp">
<link rel="stylesheet" href="/admin.css">
</head>
<body data-page="logs">
<main class="page">
  <div class="head">
    <div>
      <p class="eyebrow">History</p>
      <h1>Activity</h1>
      <p class="sub">Every change made by admins, newest first. Shows up to the last 1,000 records.</p>
    </div>
  </div>
  <div class="toolbar">
    <input id="logSearch" type="search" placeholder="Search player or action" aria-label="Search activity">
    <select id="actionFilter" aria-label="Filter by action"><option value="">All activity</option></select>
  </div>
  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead><tr><th>When</th><th>Who</th><th>What</th><th>Player</th><th>Change</th></tr></thead>
        <tbody id="logsBody"><tr><td colspan="5" class="dim">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
  <section class="danger-zone gap-lg">
    <h3>Danger zone</h3>
    <p class="dim small">Deletes the whole activity history, which also clears score history on player profiles.</p>
    <div class="btn-row"><button type="button" class="btn btn-danger-quiet" id="resetLogs">Delete all activity</button></div>
  </section>
</main>
<script src="/admin-core.js"></script>
<script src="/logs.js"></script>
</body>
</html>
