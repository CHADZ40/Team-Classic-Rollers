<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Website Text | TCR Admin</title>
<link rel="icon" href="/assets/opt/logo.webp">
<link rel="stylesheet" href="/admin.css">
</head>
<body data-page="content">
<main class="page">
  <div class="head">
    <div>
      <p class="eyebrow">Website</p>
      <h1>Website text</h1>
      <p class="sub">Edit the wording on the public Home and About pages. Changes go live as soon as you save.</p>
    </div>
  </div>
  <form id="contentForm" class="form">
    <section class="panel form">
      <h2>Home page</h2>
      <label class="field">Headline <small>Each sentence goes on its own line, and the last one turns yellow.</small><input name="homeTitle" required></label>
      <label class="field">Intro text<textarea name="homeDescription" rows="3"></textarea></label>
    </section>
    <section class="panel form">
      <h2>About page</h2>
      <label class="field">Headline<input name="aboutTitle" required></label>
      <label class="field">Intro text<textarea name="aboutDescription" rows="2"></textarea></label>
      <label class="field">Section label<input name="aboutHeading"></label>
      <label class="field">Main story <small>Shown large. The words light up as visitors scroll.</small><textarea name="aboutBody" rows="4"></textarea></label>
      <label class="field">Second paragraph<textarea name="aboutBody2" rows="4"></textarea></label>
    </section>
    <div class="btn-row"><button type="submit" class="btn btn-primary" id="saveContent">Save website text</button></div>
  </form>
</main>
<script src="/admin-core.js"></script>
<script>
  const form = $("#contentForm");
  api("/api/admin/site-data").then((data) => {
    Object.entries(data.content || {}).forEach(([key, value]) => {
      if (form.elements[key]) form.elements[key].value = String(value).replace(/[ \t]*\n\s*/g, " ");
    });
  }).catch((error) => toast(error.message, true));
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const body = Object.fromEntries(new FormData(form));
    run($("#saveContent"), () => api("/api/admin/content", { method: "PATCH", body }), "Website text saved.");
  });
</script>
</body>
</html>
