<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Players | TCR Admin</title>
<link rel="icon" href="/assets/opt/logo.webp">
<link rel="stylesheet" href="/admin.css">
</head>
<body data-page="players">
<main class="page">
  <div class="head">
    <div>
      <p class="eyebrow">Roster</p>
      <h1>Players</h1>
      <p class="sub">Find a player, then add their score or edit their details. Every change is saved in Activity.</p>
    </div>
    <button type="button" class="btn btn-primary" id="newPlayer">Add a player</button>
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search by name" aria-label="Search players by name" autocomplete="off">
    <div class="tabs" id="squads" role="group" aria-label="Filter by squad">
      <button type="button" data-squad="all" aria-pressed="true">All</button>
      <button type="button" data-squad="Team A" aria-pressed="false">Team A</button>
      <button type="button" data-squad="Team B" aria-pressed="false">Team B</button>
      <button type="button" data-squad="Team C" aria-pressed="false">Team C</button>
    </div>
  </div>

  <div class="players" id="players"></div>
  <p class="empty" id="noPlayers" hidden>No player matches that search.</p>

  <section class="danger-zone gap-lg">
    <h3>Danger zone</h3>
    <p class="dim small">Resets every player's games and pins to zero. Only use this to start a new season.</p>
    <div class="btn-row"><button type="button" class="btn btn-danger-quiet" id="resetAll">Reset all scores</button></div>
  </section>
</main>
<script src="/admin-core.js"></script>
<script src="/players.js"></script>
</body>
</html>
