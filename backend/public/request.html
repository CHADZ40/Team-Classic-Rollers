<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Score Requests | TCR Admin</title>
<link rel="icon" href="/assets/opt/logo.webp">
<link rel="stylesheet" href="/admin.css">
</head>
<body data-page="requests">
<main class="page">
  <div class="head">
    <div>
      <p class="eyebrow">Review</p>
      <h1>Score requests</h1>
      <p class="sub">Check the proof, confirm who it belongs to, then approve or reject. New requests appear here by themselves.</p>
    </div>
  </div>
  <div class="toolbar">
    <div class="tabs" id="tabs" role="group" aria-label="Filter requests">
      <button type="button" data-status="pending" aria-pressed="true">Waiting <span id="nPending"></span></button>
      <button type="button" data-status="approved" aria-pressed="false">Approved <span id="nApproved"></span></button>
      <button type="button" data-status="rejected" aria-pressed="false">Rejected <span id="nRejected"></span></button>
    </div>
  </div>
  <div id="requests"></div>
</main>
<script src="/admin-core.js"></script>
<script src="/request.js"></script>
</body>
</html>
