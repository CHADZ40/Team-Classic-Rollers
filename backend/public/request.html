<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Score Requests | TCR Admin</title>
  <link rel="icon" href="/assets/tcr-logo.png">
  <link rel="stylesheet" href="/admin.css">
  <style>
    .request-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--yellow);
      border-radius: 12px;
      padding: 22px;
      margin: 16px 0;
      box-shadow: var(--shadow)
    }

    .request-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap
    }

    .request-head h3 {
      font: 700 25px Archivo, sans-serif;
      margin: 4px 0
    }

    .request-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 12px 0
    }

    .request-meta strong {
      color: var(--blue)
    }

    .request-proof {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0
    }

    .request-proof a {
      display: block
    }

    .request-proof img {
      width: 115px;
      height: 100px;
      object-fit: cover;
      border: 1px solid var(--border);
      border-radius: 8px
    }

    .request-actions {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(160px, 1fr) auto auto;
      gap: 10px;
      align-items: end;
      margin-top: 16px
    }

    .request-actions label {
      display: grid;
      gap: 6px;
      font-weight: 600
    }

    .request-actions select,
    .request-actions input {
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      min-width: 0;
      width: 100%
    }

    .state {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: max-content;
      max-width: 100%;
      min-height: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 210, 0, .16);
      color: #ffd200;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      text-transform: uppercase;
      flex: 0 0 auto
    }

    .state.approved {
      background: rgba(56, 210, 122, .15);
      color: #6fe3a3
    }

    .state.rejected {
      background: rgba(232, 19, 47, .16);
      color: #ff8c9a
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: var(--muted)
    }

    @media(max-width:760px) {
      .request-actions {
        grid-template-columns: 1fr
      }

      .request-head {
        flex-direction: column
      }

      .request-card {
        padding: 16px
      }
    }
  </style>
</head>

<body>
  <header class="admin-header"><a href="/dashboard.html" class="brand"><img src="/assets/opt/logo.webp"
        alt=""><span>TEAM CLASSIC <strong>ROLLERS</strong><small>ADMIN DASHBOARD</small></span></a>
    <div class="header-actions"><a href="/dashboard.html" class="btn btn-outline">Dashboard</a><a href="/logs"
        class="btn btn-outline">Activity Logs</a><button id="logoutBtn" class="btn btn-ghost">Log Out</button></div>
  </header>
  <main class="admin-shell">
    <section class="welcome-row">
      <div>
        <p class="eyebrow">CONTROL CENTER · V0.1.2</p>
        <h1>Score Requests</h1>
        <p class="muted">Review proof, choose the matching roster member, then approve or reject.</p>
      </div><button id="refreshBtn" class="btn btn-primary">Refresh Requests</button>
    </section>
    <div id="notice" class="notice" aria-live="polite"></div>
    <section class="overview-grid">
      <article class="overview-card"><span>Pending</span><strong id="pendingCount">0</strong></article>
      <article class="overview-card"><span>Approved</span><strong id="approvedCount">0</strong></article>
      <article class="overview-card"><span>Rejected</span><strong id="rejectedCount">0</strong></article>
    </section>
    <section>
      <div id="requestsList"></div>
    </section>
  </main>
  <script src="/request.js"></script>
  <script src="/request-badge.js"></script>
</body>

</html>
