# Public website. Build first: cd frontend && npm ci && npm run build
server {
    listen 80;
    server_name teamclassicrollers.club www.teamclassicrollers.club;
    root /var/www/teamclassicrollers/frontend/dist;
    index index.html;

    # Bundled files have a content hash in the name, so they can be cached for good.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Members added after the last build are handled by the app itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The old score form address now sends people to /submit.
server {
    listen 80;
    server_name games.teamclassicrollers.club;
    return 301 https://teamclassicrollers.club/submit$is_args$args;
}
